<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="980" height="250" role="img" aria-labelledby="t">
<title id="t">What the statusline shows in each state</title>
<rect width="980" height="250" fill="#002b36"/>
<rect x="20" y="20" width="940" height="34" fill="#073642"/>
<text x="32" y="42" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">STATE</text>
<text x="282" y="42" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">STATUSLINE ROW</text>
<text x="712" y="42" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">WHEN</text>
<text x="32" y="81.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">Subscribed</text>
<text x="282" y="81.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="14" xml:space="preserve"><tspan fill="#e95378">Claude</tspan><tspan fill="#707275"> │ ⏱︎ 5h 76% · 3h │ ↻ 7d 94% · 10h</tspan></text>
<text x="712" y="81.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">limits are reported</text>
<text x="32" y="125.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">Not logged in</text>
<text x="282" y="125.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">(row hidden)</text>
<text x="712" y="125.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">no subscription</text>
<text x="32" y="169.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">Logged in, no limits</text>
<text x="282" y="169.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="14" xml:space="preserve"><tspan fill="#e95378">OpenAI</tspan><tspan fill="#707275"> │ no quota data</tspan></text>
<text x="712" y="169.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">plan without usage data</text>
<text x="32" y="213.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">Check failed</text>
<text x="282" y="213.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">OpenAI quota unavailable</text>
<text x="712" y="213.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">real failure or timeout only</text>
