<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-labelledby="t">
<title id="t">What the statusline shows in each state</title>
<rect width="1000" height="392" fill="#002b36"/>
<text x="40" y="50" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">What you see</text>
<rect x="40" y="76" width="450" height="120" fill="none" stroke="#3b5560" stroke-width="1.5"/>
<text x="56" y="106" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">Subscribed</text>
<text x="56" y="128" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">Limits appear</text>
<text x="56" y="170" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="14" xml:space="preserve"><tspan fill="#e95378">Claude</tspan><tspan fill="#707275"> │ </tspan><tspan fill="#e95378">⏱︎</tspan><tspan fill="#707275"> 5h </tspan><tspan fill="#27d797">76%</tspan><tspan fill="#707275"> · 3h │ </tspan><tspan fill="#e95378">↻</tspan><tspan fill="#707275"> 7d </tspan><tspan fill="#27d797">94%</tspan><tspan fill="#707275"> · 10h</tspan></text>
<rect x="510" y="76" width="450" height="120" fill="none" stroke="#3b5560" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="526" y="106" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">Not logged in</text>
<text x="526" y="128" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">The row is hidden</text>
<text x="735" y="172" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#707275" text-anchor="middle" xml:space="preserve">nothing shown</text>
<rect x="40" y="216" width="450" height="120" fill="none" stroke="#3b5560" stroke-width="1.5"/>
<text x="56" y="246" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">Logged in, no limits reported</text>
<text x="56" y="268" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">For example a plan without usage data</text>
<text x="56" y="310" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="14" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve"><tspan fill="#e95378">OpenAI</tspan><tspan fill="#707275"> │ no quota data</tspan></text>
<rect x="510" y="216" width="450" height="120" fill="none" stroke="#3b5560" stroke-width="1.5"/>
<text x="526" y="246" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">Check failed or timed out</text>
<text x="526" y="268" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">Shown only for real failures</text>
<text x="526" y="310" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="14" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve"><tspan fill="#707275">OpenAI quota unavailable</tspan></text>
<text x="40" y="372" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">Rows are redrawn from the real statusline. See the screenshot in the README.</text>
</svg>
