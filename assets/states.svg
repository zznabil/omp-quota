<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t">
  <title id="t">What the statusline shows in each state</title>
  <rect width="1200" height="440" rx="16" fill="#0d1117"/>
  <g font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
    <text x="40" y="52" font-size="24" font-weight="700" fill="#e6edf3">What you see</text>

    <rect x="40" y="76" width="540" height="162" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="68" cy="106" r="7" fill="#3fb950"/>
    <text x="86" y="112" font-size="19" font-weight="700" fill="#e6edf3">Subscribed</text>
    <text x="64" y="138" font-size="14" fill="#8b949e">Quota windows appear</text>
    <rect x="64" y="158" width="492" height="56" rx="8" fill="#010409" stroke="#30363d"/>
    <text x="80" y="192" font-size="17" font-family="Consolas,'Cascadia Mono',Menlo,monospace" xml:space="preserve"><tspan fill="#58a6ff">Claude</tspan><tspan fill="#8b949e"> │ </tspan><tspan fill="#58a6ff">⏱</tspan><tspan fill="#8b949e"> 5h </tspan><tspan fill="#3fb950">95%</tspan><tspan fill="#8b949e"> · 2h │ </tspan><tspan fill="#58a6ff">↻</tspan><tspan fill="#8b949e"> 7d </tspan><tspan fill="#3fb950">99%</tspan></text>

    <rect x="620" y="76" width="540" height="162" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="648" cy="106" r="7" fill="#8b949e"/>
    <text x="666" y="112" font-size="19" font-weight="700" fill="#e6edf3">Not logged in</text>
    <text x="644" y="138" font-size="14" fill="#8b949e">The entry is hidden</text>
    <rect x="644" y="158" width="492" height="56" rx="8" fill="none" stroke="#30363d" stroke-dasharray="6 6"/>
    <text x="890" y="192" font-size="16" fill="#8b949e" text-anchor="middle" font-style="italic">nothing shown</text>

    <rect x="40" y="258" width="540" height="162" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="68" cy="288" r="7" fill="#d29922"/>
    <text x="86" y="294" font-size="19" font-weight="700" fill="#e6edf3">Logged in, no limits reported</text>
    <text x="64" y="320" font-size="14" fill="#8b949e">For example a plan without usage data</text>
    <rect x="64" y="340" width="492" height="56" rx="8" fill="#010409" stroke="#30363d"/>
    <text x="80" y="374" font-size="17" font-family="Consolas,'Cascadia Mono',Menlo,monospace" xml:space="preserve"><tspan fill="#58a6ff">OpenAI</tspan><tspan fill="#8b949e"> │ no quota data</tspan></text>

    <rect x="620" y="258" width="540" height="162" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="648" cy="288" r="7" fill="#f85149"/>
    <text x="666" y="294" font-size="19" font-weight="700" fill="#e6edf3">Check failed or timed out</text>
    <text x="644" y="320" font-size="14" fill="#8b949e">Shown only for real failures</text>
    <rect x="644" y="340" width="492" height="56" rx="8" fill="#010409" stroke="#30363d"/>
    <text x="660" y="374" font-size="17" font-family="Consolas,'Cascadia Mono',Menlo,monospace" fill="#8b949e">OpenAI quota unavailable</text>
  </g>
</svg>
