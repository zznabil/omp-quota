<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 206" width="960" height="206" role="img" aria-labelledby="t">
<title id="t">How it works: omp usage, read the limits, update the statusline</title>
<rect width="960" height="206" fill="#002b36"/>
<rect x="20" y="20" width="920" height="34" fill="#073642"/>
<text x="32" y="42" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">STEP</text>
<text x="132" y="42" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">WHAT HAPPENS</text>
<text x="552" y="42" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">RUNS</text>
<text x="32" y="81.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">1 ASK</text>
<text x="132" y="81.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#93a1a1" text-anchor="start" xml:space="preserve">omp usage --provider … --json</text>
<text x="552" y="81.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">on session start</text>
<text x="32" y="125.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">2 READ</text>
<text x="132" y="125.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#93a1a1" text-anchor="start" xml:space="preserve">5h · 7d · banked resets</text>
<text x="552" y="125.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">after every turn</text>
<text x="32" y="169.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">3 UPDATE</text>
<text x="132" y="169.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#93a1a1" text-anchor="start" xml:space="preserve">one statusline row per provider</text>
<text x="552" y="169.0" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="15" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">every 5 min, 10 s timeout</text>
