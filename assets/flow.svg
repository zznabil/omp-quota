<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 230" width="1040" height="230" role="img" aria-labelledby="t">
<title id="t">How it works: omp usage, read the limits, update the statusline</title>
<rect width="1040" height="230" fill="#002b36"/>
<text x="40" y="50" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">How it works</text>
<rect x="40" y="76" width="280" height="86" fill="none" stroke="#3b5560" stroke-width="1.5"/>
<text x="58" y="112" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">1  Ask OMP</text>
<text x="58" y="140" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="14" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">omp usage --provider … --json</text>
<rect x="380" y="76" width="280" height="86" fill="none" stroke="#3b5560" stroke-width="1.5"/>
<text x="398" y="112" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">2  Read the limits</text>
<text x="398" y="140" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">5h · 7d · banked resets</text>
<rect x="720" y="76" width="280" height="86" fill="none" stroke="#3b5560" stroke-width="1.5"/>
<text x="738" y="112" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">3  Update the statusline</text>
<text x="738" y="140" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" font-weight="400" fill="#707275" text-anchor="start" xml:space="preserve">One row per provider</text>
<path d="M326 119 h22 m-7 -7 l7 7 l-7 7" fill="none" stroke="#5ebdec" stroke-width="2"/>
<path d="M666 119 h22 m-7 -7 l7 7 l-7 7" fill="none" stroke="#5ebdec" stroke-width="2"/>
<text x="520" y="204" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" font-weight="400" fill="#707275" text-anchor="middle" xml:space="preserve">on session start  ·  after every turn  ·  every 5 min  ·  10 s timeout</text>
</svg>
