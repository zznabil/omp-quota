<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 150" width="980" height="150" role="img" aria-labelledby="t">
<title id="t">Colour by remaining quota: red 10% or below, yellow 25% or below, green above 25%</title>
<rect width="980" height="150" fill="#002b36"/>
<text x="40" y="34" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#5ebdec" text-anchor="start" xml:space="preserve">COLOUR BY REMAINING QUOTA</text>
<rect x="40.0" y="50" width="90.0" height="34" fill="#e95378"/>
<text x="85.0" y="106" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#707275" text-anchor="middle" xml:space="preserve">10% or below</text>
<rect x="130.0" y="50" width="135.0" height="34" fill="#d9a521"/>
<text x="197.5" y="106" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#707275" text-anchor="middle" xml:space="preserve">25% or below</text>
<rect x="265.0" y="50" width="675.0" height="34" fill="#27d797"/>
<text x="602.5" y="106" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="13" font-weight="400" fill="#707275" text-anchor="middle" xml:space="preserve">above 25%</text>
<line x1="40.0" y1="46" x2="40.0" y2="90" stroke="#002b36" stroke-width="2"/>
<text x="40.0" y="130" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#93a1a1" text-anchor="middle" xml:space="preserve">0%</text>
<line x1="130.0" y1="46" x2="130.0" y2="90" stroke="#002b36" stroke-width="2"/>
<text x="130.0" y="130" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#93a1a1" text-anchor="middle" xml:space="preserve">10%</text>
<line x1="265.0" y1="46" x2="265.0" y2="90" stroke="#002b36" stroke-width="2"/>
<text x="265.0" y="130" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#93a1a1" text-anchor="middle" xml:space="preserve">25%</text>
<line x1="940.0" y1="46" x2="940.0" y2="90" stroke="#002b36" stroke-width="2"/>
<text x="940.0" y="130" font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#93a1a1" text-anchor="middle" xml:space="preserve">100%</text>
</svg>
