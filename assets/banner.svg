<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">omp-quota</title>
  <desc id="d">OMP statusline extensions showing live OpenAI Codex and Claude subscription quota.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <text x="60" y="88" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="46" font-weight="700" fill="#e6edf3">omp-quota</text>
  <text x="60" y="128" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" fill="#8b949e">Live OpenAI Codex and Claude subscription quota in your OMP statusline.</text>

  <rect x="60" y="164" width="1080" height="184" rx="10" fill="#010409" stroke="#30363d"/>
  <circle cx="86" cy="186" r="6" fill="#f85149"/>
  <circle cx="108" cy="186" r="6" fill="#d29922"/>
  <circle cx="130" cy="186" r="6" fill="#3fb950"/>
  <line x1="60" y1="204" x2="1140" y2="204" stroke="#30363d"/>

  <g font-family="Consolas,'Cascadia Mono','SF Mono',Menlo,monospace" font-size="20" xml:space="preserve">
    <text x="90" y="246"><tspan fill="#58a6ff">OpenAI</tspan><tspan fill="#8b949e"> │ </tspan><tspan fill="#58a6ff">⏱</tspan><tspan fill="#8b949e"> Codex 5h </tspan><tspan fill="#3fb950">91%</tspan><tspan fill="#8b949e"> · 2h │ </tspan><tspan fill="#58a6ff">↻</tspan><tspan fill="#8b949e"> Codex 7d </tspan><tspan fill="#3fb950">70%</tspan><tspan fill="#8b949e"> · 3d 2h │ </tspan><tspan fill="#58a6ff">◆</tspan><tspan fill="#8b949e"> Banked resets </tspan><tspan fill="#3fb950">2</tspan><tspan fill="#8b949e"> · 16d</tspan></text>
    <text x="90" y="284"><tspan fill="#58a6ff">Claude</tspan><tspan fill="#8b949e"> │ </tspan><tspan fill="#58a6ff">⏱</tspan><tspan fill="#8b949e"> 5h </tspan><tspan fill="#d29922">22%</tspan><tspan fill="#8b949e"> · 1h │ </tspan><tspan fill="#58a6ff">↻</tspan><tspan fill="#8b949e"> 7d </tspan><tspan fill="#3fb950">99%</tspan><tspan fill="#8b949e"> · 2d 5h │ </tspan><tspan fill="#58a6ff">◆</tspan><tspan fill="#8b949e"> Banked resets </tspan><tspan fill="#3fb950">1</tspan><tspan fill="#8b949e"> · 16d</tspan></text>
    <circle cx="96" cy="316" r="6" fill="#3fb950"/><text x="110" y="322" fill="#8b949e">above 25%</text>
    <circle cx="256" cy="316" r="6" fill="#d29922"/><text x="270" y="322" fill="#8b949e">25% or below</text>
    <circle cx="450" cy="316" r="6" fill="#f85149"/><text x="464" y="322" fill="#8b949e">10% or below</text>
  </g>

  <g font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" fill="#8b949e">
    <text x="60" y="378">An entry is hidden when its provider isn't subscribed.</text>
